<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A — Standup</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* DIRECTION A — "Standup".
   One column, read top to bottom, finished in thirty seconds. No cards, no
   panels: rules and space do the grouping. The only colour is the one that
   means "this is yours to answer". Everything else is text. */
:root{
  --bg:#0d0d0c; --ink:#eceae5; --ink-2:#a9a49a; --dim:#6f6b63;
  --rule:#232320; --hot:#e8a33d; --live:#5fb98a; --cold:#c4614f;
  --serif:'Newsreader',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:light){:root:not([data-t="dark"]){
  --bg:#faf8f4; --ink:#1a1a18; --ink-2:#4a463f; --dim:#807a70;
  --rule:#e2ded6; --hot:#a86a12; --live:#2f7a55; --cold:#a33b2a;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.col{max-width:64ch;margin:0 auto;padding:56px 24px 120px}
.kick{font:500 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
h1{font:600 clamp(30px,5vw,42px)/1.1 var(--serif);margin:6px 0 4px;letter-spacing:-.015em}
.lede{color:var(--ink-2);margin:0 0 6px;font-size:18px}
.src{font:400 11px var(--mono);color:var(--dim);margin-top:22px;padding-top:10px;border-top:1px solid var(--rule)}

h2{font:500 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim);margin:46px 0 0;display:flex;align-items:baseline;gap:12px}
h2 .n{color:var(--ink);font-weight:600}
h2::after{content:"";flex:1;height:1px;background:var(--rule)}

ol,ul{list-style:none;margin:14px 0 0;padding:0}
li{padding:13px 0;border-bottom:1px solid var(--rule);display:flex;gap:14px;align-items:baseline}
li:last-child{border-bottom:0}
.idx{font:500 12px var(--mono);color:var(--hot);min-width:2.2ch;flex:none}
.body{flex:1;min-width:0}
.t{display:block;font-size:17px;line-height:1.4}
.why{display:block;color:var(--dim);font-size:14.5px;margin-top:3px}
.meta{font:400 12px var(--mono);color:var(--dim);white-space:nowrap;flex:none}
a{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule)}
a:hover{border-bottom-color:var(--ink-2)}
.tag{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;
  padding:2px 7px;border:1px solid var(--rule);border-radius:3px;color:var(--dim);flex:none}
.tag.hot{color:var(--hot);border-color:color-mix(in srgb,var(--hot) 45%,transparent)}
.tag.live{color:var(--live);border-color:color-mix(in srgb,var(--live) 45%,transparent)}
.quiet{color:var(--dim);font-size:15.5px;padding:14px 0}
.nosrc{opacity:.62}
.nosrc .t{color:var(--ink-2)}
.dash{color:var(--dim);font:400 12px var(--mono)}
footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--rule);
  color:var(--dim);font-size:14px;line-height:1.6}
</style></head><body>
<div class="col" id="app"><p class="quiet">Reading the Command Center…</p></div>
<script src="/try/data.js"></script>
<script>
(async () => {
  const { load, ago, esc } = window.CC;
  const app = document.getElementById('app');
  let d; try { d = await load(); } catch (e) {
    app.innerHTML = `<p class="quiet">Could not reach the Command Center. ${esc(e.message)}</p>`; return; }

  const now = new Date();
  const day = now.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});

  // The one sentence that decides whether you read further.
  const n = d.needsYou.length, f = d.inFlight.length;
  const lede = n === 0 && f === 0
    ? 'Nothing is waiting on you and nothing is running.'
    : [n ? `${n} thing${n>1?'s':''} waiting on you` : null,
       f ? `${f} running` : null].filter(Boolean).join(' · ');

  const row = (idx, title, why, meta, tag) => `<li>
    <span class="idx">${idx}</span>
    <span class="body"><span class="t">${esc(title)}</span>
      ${why ? `<span class="why">${esc(why)}</span>` : ''}</span>
    ${tag || ''}${meta ? `<span class="meta">${esc(meta)}</span>` : ''}</li>`;

  app.innerHTML = `
    <div class="kick">${esc(day)}</div>
    <h1>${n ? 'Your desk' : 'All clear'}</h1>
    <p class="lede">${esc(lede)}</p>

    <h2>Needs you <span class="n">${n}</span></h2>
    ${n ? `<ol>${d.needsYou.map((i,k)=>row(
        String(k+1).padStart(2,'0'), i.title, i.why,
        i.at ? ago(i.at) : '', `<span class="tag hot">${esc(i.kind)}</span>`)).join('')}</ol>`
      : `<p class="quiet">Nothing. Every draft has been ruled on and no agent is waiting for a decision.</p>`}

    <h2>In flight <span class="n">${f}</span></h2>
    ${f ? `<ul>${d.inFlight.map(i=>row('·', i.title, i.sub, ago(i.started),
        `<span class="tag live">running</span>`)).join('')}</ul>`
      : `<p class="quiet">Nothing running.</p>`}

    <h2>Today <span class="n">${d.today.length}</span></h2>
    ${d.today.length ? `<ul>${d.today.map(i=>row(
        esc(i.time||'--:--'), i.title, i.source, i.status,'')).join('')}</ul>`
      : `<p class="quiet">Nothing scheduled.</p>`}

    <h2>Streams</h2>
    <ul>${d.streams.map(s => s.source
      ? row('·', s.name, s.next || '', s.stage || '',
            s.blocked ? '<span class="tag hot">blocked</span>' : '')
      : `<li class="nosrc"><span class="idx dash">—</span>
           <span class="body"><span class="t">${esc(s.name)}</span>
           <span class="why">${esc(s.why)}</span></span>
           <span class="meta">no source</span></li>`).join('')}</ul>

    <footer>
      Read live from this server: <code>/api/venture</code>, <code>/api/outbox</code>,
      <code>/api/history</code>, <code>/api/agenda</code>, <code>/api/orchestrations</code>.
      Three of the five streams have no endpoint at all — they are listed as unwired
      rather than left out, because an empty row and a missing row mean different things.
      ${d.stale ? '<br><b>The venture board could not read the workspace</b>, so its gates may be wrong.' : ''}
    </footer>`;
})();
</script></body></html>
