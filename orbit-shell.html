<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA — Agentic OS</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Space+Grotesk:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
<!--KEYFRAMES-->
html,body{margin:0;padding:0;background:#04070d}
body.light{background:#e9e8e4}
.screen{display:none}
.screen.on{display:block}
#stage{display:flex;justify-content:center;padding:18px;overflow-x:hidden}
/* The comp lays the orbit ring out in absolute coordinates against a 1440px
   frame. max-width:100% used to squash that frame on any narrower screen, so
   the right-hand ring nodes (SECOND BRAIN, PROWOOD) slid under the NEEDS TYLER
   rail and overlapped its text. Keep the design width and scale it instead. */
.frame{width:1440px;flex:none;transform-origin:top center}
/* hover states the design expressed as style-hover attributes */
.frame [data-hook="skill-name"]{cursor:pointer}
#themeBtn{position:fixed;right:16px;top:16px;z-index:40;font:600 9px 'JetBrains Mono',monospace;
  letter-spacing:.16em;padding:8px 12px;border-radius:20px;cursor:pointer;
  background:rgba(0,229,255,.14);color:#00e5ff;border:1px solid rgba(0,229,255,.45)}
body.light #themeBtn{background:rgba(11,196,180,.12);color:#0a7d74;border-color:rgba(11,196,180,.5)}
/* run output — the mock has no log surface, so this slides in when one starts */
#runPanel{position:fixed;right:0;top:0;bottom:0;width:520px;max-width:92vw;z-index:50;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  background:#04070d;border-left:1px solid rgba(0,229,255,.35);display:flex;flex-direction:column}
body.light #runPanel{background:#f0efec;border-left-color:rgba(0,0,0,.18)}
#runPanel.open{transform:none}
#runHead{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.1);
  font:600 10px 'JetBrains Mono',monospace;letter-spacing:.16em;color:#00e5ff}
body.light #runHead{color:#0a7d74;border-bottom-color:rgba(0,0,0,.12)}
/* Several runs can be in flight now. The panel still shows one at a time -- it
   is a slide-over, not a workspace -- but starting a second no longer orphans
   the first: it becomes a chip here. Hidden entirely below two runs. */
#runTabs{display:flex;gap:6px;padding:8px 18px;overflow-x:auto;
  border-bottom:1px solid rgba(255,255,255,.1)}
body.light #runTabs{border-bottom-color:rgba(0,0,0,.12)}
#runTabs[hidden]{display:none}
#runTabs button{flex:none;max-width:200px;display:inline-flex;align-items:center;gap:6px;
  cursor:pointer;background:none;border:1px solid rgba(255,255,255,.16);border-radius:4px;
  padding:4px 9px;font:600 9px 'JetBrains Mono',monospace;letter-spacing:.1em;
  color:rgba(232,246,250,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#runTabs button[data-on="1"]{border-color:#00e5ff;color:#00e5ff}
body.light #runTabs button{border-color:rgba(0,0,0,.18);color:#6c6c68}
body.light #runTabs button[data-on="1"]{border-color:#0a7d74;color:#0a7d74}
#runTabs .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
#runTabs button[data-state="running"] .dot{animation:orbPulse 1.2s ease-in-out infinite}
@keyframes orbPulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#runTabs button[data-state="running"] .dot{animation:none}}

#runLog{flex:1;overflow:auto;padding:16px 18px;white-space:pre-wrap;word-break:break-word;
  font:400 12px/1.6 'JetBrains Mono',monospace;color:rgba(232,246,250,.8)}
body.light #runLog{color:#2a2a28}
#runClose,#runStop{margin-left:auto;cursor:pointer;font:600 9px 'JetBrains Mono',monospace;
  letter-spacing:.14em;color:rgba(232,246,250,.55);background:none;border:0}
body.light #runClose,body.light #runStop{color:#6c6c68}
/* the command bar is the most-used control: give it a real focus state and a
   comfortable target instead of a 22px placeholder-looking strip */
[data-hook="cmd"]{min-height:34px}
[data-hook="cmd"]::placeholder{opacity:.85}
.cmdwrap:focus-within{outline:2px solid currentColor;outline-offset:3px}
[data-hook="skill-card"]{cursor:pointer;min-height:44px}
[data-hook="skill-card"]:hover{border-color:rgba(255,255,255,.35)}
body.light [data-hook="skill-card"]:hover{border-color:rgba(0,0,0,.35)}
/* The design runs ten looping animations; honour the system preference. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important}
}
/* Keyboard parity: every mouse target is reachable and shows where focus is. */
:focus{outline:none}
:focus-visible{outline:2px solid currentColor;outline-offset:3px;border-radius:8px}
/* State changes ease rather than snap (150-300ms, ease-out on enter). */
[data-hook="skill-card"],[data-hook="cmd"],#themeBtn,.past-row{
  transition:border-color .18s ease-out,background-color .18s ease-out,
             color .18s ease-out,opacity .18s ease-out,transform .12s ease-out}
[data-hook="skill-card"]:active{transform:scale(.985)}
#themeBtn:hover{filter:brightness(1.15)}
/* Editing controls for the OPEN DECISIONS / NEEDS TYLER panels. The comp drew
   these as read-only rows; the buttons are layered on so a restyle upstream
   still survives a rebuild. They stay hidden until the row is hovered or
   focused so the panel reads as calmly as it was designed to. */
.cc-row{position:relative}
.cc-close{position:absolute;right:-2px;top:2px;z-index:3;cursor:pointer;
  background:transparent;border:1px solid currentColor;border-radius:999px;
  color:inherit;opacity:0;padding:1px 6px;line-height:1.5;
  font:600 8px 'JetBrains Mono',monospace;letter-spacing:.1em;transition:opacity .12s}
.cc-row:hover .cc-close,.cc-row:focus-within .cc-close{opacity:.75}
.cc-close:hover{opacity:1!important}
.cc-close:focus-visible{opacity:1!important;outline:2px solid #00e5ff;outline-offset:1px}
.cc-add{cursor:pointer;background:transparent;border:0;color:inherit;opacity:.55;
  font:600 9px 'JetBrains Mono',monospace;letter-spacing:.12em;padding:0 0 0 8px}
.cc-add:hover{opacity:1}
.cc-add:focus-visible{opacity:1;outline:2px solid #00e5ff;outline-offset:2px}
/* Ticking figures must not shift the layout under them. */
[data-hook="time"],[data-hook="mail-total"],[data-hook="skill-status"],
[data-hook="runtime"],.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
/* scale is measured in JS — see fitFrame() */
</style>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
</head>
<body>
<button id="themeBtn">THEME</button>

<div id="stage">
  <div class="frame">
    <div class="screen on" id="dark"><!--DARK--></div>
    <div class="screen" id="light"><!--LIGHT--></div>
  </div>
</div>

<aside id="runPanel">
  <div id="runHead"><span id="runTitle">RUN</span>
    <button id="runStop">STOP</button><button id="runClose">CLOSE</button></div>
  <div id="runTabs" hidden></div>
  <div id="runLog"></div>
</aside>

<script src="./particle-cloud.js"></script>
<script>
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* One status vocabulary across both pages: RUNNING / DONE / FAILED / STOPPED /
   IDLE for runs, DONE / NEXT / WAITING for schedules. */
const SAY = { running: 'RUNNING', done: 'DONE', fault: 'FAILED', stopped: 'STOPPED' };
const say = v => SAY[v] || String(v).toUpperCase();

/* Accent discipline: orange marks something that wants Tyler. Structure and
   description stay neutral. */
/* Both copies of the screen are painted in one pass, so the neutral has to come
   from the screen being written to — not from whichever theme is on show. */
const neutralFor = id => id === 'light' ? '#5b5b56' : 'rgba(232,246,250,.55)';

/* ---------- theme ---------------------------------------------------- */
const KEY = 'nova-theme';
function setTheme(t) {
  document.body.classList.toggle('light', t === 'light');
  document.getElementById('dark').classList.toggle('on', t !== 'light');
  document.getElementById('light').classList.toggle('on', t === 'light');
  try { localStorage.setItem(KEY, t); } catch (e) {}
}
let theme = 'dark';
try { theme = localStorage.getItem(KEY) || 'dark'; } catch (e) {}
setTheme(theme);
document.getElementById('themeBtn').onclick = () =>
  setTheme(document.body.classList.contains('light') ? 'dark' : 'light');

/* ---------- clock ---------------------------------------------------- */
function tick() {
  const d = new Date();
  let h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0');
  const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;
  $$('[data-hook="time"]').forEach(e => e.textContent = `${h}:${m}`);
  $$('[data-hook="time"]').forEach(e => {
    const sib = e.nextElementSibling;
    if (sib && /am|pm/.test(sib.textContent)) sib.textContent = ' ' + ap;
  });
  const wk = Math.ceil(((d - new Date(d.getFullYear(), 0, 1)) / 86400000 + 1) / 7);
  const line = d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })
    .toUpperCase().replace(',', '') + ` · WK ${wk} · WORKSHOP`;
  $$('[data-hook="date"]').forEach(e => e.textContent = line);
}
tick(); setInterval(tick, 10000);

/* ---------- Command Center ------------------------------------------- */
let SKILLS = [], POLL = null;
// Keyed runs: the panel shows one, but every live run keeps its own buffer
// and offset, so starting a second no longer abandons the first.
const RUNS = new Map();   // id -> {id,label,status,offset,text,elapsed}
let VIEW = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(`${path} -> ${r.status}`);
  return r.json();
}

async function loadSkills() {
  try {
    const { skills } = await api('/api/skills');
    SKILLS = skills;
    const hist = await api('/api/history').then(h => h.runs).catch(() => []);

    /* The comp drew four skill slots and there are eighteen skills, so the
       slots showed whichever four happened to sit at the top of skills.json.
       Rank by how often each one actually runs instead — the full roster is a
       click away on AGENTS. */
    const uses = {};
    hist.forEach(r => { uses[r.skill] = (uses[r.skill] || 0) + 1; });
    const ranked = skills.slice().sort((a, b) =>
      (uses[b.skill] || 0) - (uses[a.skill] || 0) ||
      skills.indexOf(a) - skills.indexOf(b));

    ['dark', 'light'].forEach(id => {
      const root = document.getElementById(id);
      const names = $$('[data-hook="skill-name"]', root);
      names.forEach((el, i) => {
        const s = ranked[i]; if (!s) return;
        el.textContent = '/' + s.skill;
        el.dataset.skill = s.skill;
        el.title = s.placeholder || s.prompt;
        const card = el.parentElement;
        const status = $$('[data-hook="skill-status"]', card).pop();
        const last = hist.find(r => r.skill === s.skill);
        if (status) status.textContent = last ? `${say(last.status)} · ${last.elapsed}s` : 'IDLE';
        // the model name is structural, not an ask — keep it off the accent.
        // it carries a different font weight so the build never hooked it.
        $$('span', card).filter(x => x !== status).forEach(x => x.style.color = neutralFor(id));
      });
    });
    $$('[data-hook="runtime"]').forEach(e =>
      e.textContent = `RUNTIME ONLINE · ${skills.length} SKILLS`);
  } catch (e) {
    $$('[data-hook="runtime"]').forEach(el => el.textContent = 'RUNNER OFFLINE');
  }
}

function openPanel(title) {
  document.getElementById('runTitle').textContent = title.toUpperCase();
  const logEl = document.getElementById('runLog');
  logEl.textContent = 'Starting…';
  logEl.setAttribute('aria-live', 'polite');
  logEl.setAttribute('aria-busy', 'true');
  document.getElementById('runPanel').classList.add('open');
}
document.getElementById('runClose').onclick = () =>
  document.getElementById('runPanel').classList.remove('open');
document.getElementById('runStop').onclick = async () => {
  const r = RUNS.get(VIEW);
  if (r && r.status === 'running') await fetch('/api/stop/' + r.id, { method: 'POST' });
};

function drawRunTabs() {
  const el = document.getElementById('runTabs');
  const list = [...RUNS.values()];
  el.hidden = list.length < 2;
  if (el.hidden) { el.innerHTML = ''; return; }
  el.innerHTML = '';
  list.forEach(r => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.on = r.id === VIEW ? '1' : '0';
    b.dataset.state = r.status;
    b.innerHTML = '<span class="dot"></span><span class="lbl"></span>';
    b.querySelector('.lbl').textContent = r.label;
    b.onclick = () => showRun(r.id);
    el.appendChild(b);
  });
}

function showRun(id) {
  const r = RUNS.get(id);
  if (!r) return;
  VIEW = id;
  const log = document.getElementById('runLog');
  log.textContent = r.text || 'Starting\u2026';
  log.scrollTop = log.scrollHeight;
  log.setAttribute('aria-busy', r.status === 'running' ? 'true' : 'false');
  document.getElementById('runTitle').textContent =
    `${r.label} \u00b7 ${say(r.status)}${r.elapsed ? ' \u00b7 ' + r.elapsed + 's' : ''}`;
  document.getElementById('runStop').hidden = r.status !== 'running';
  drawRunTabs();
}

async function start(skill, label, prompt) {
  openPanel(label);
  try {
    const job = await api('/api/run', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ skill, label, prompt })
    });
    RUNS.set(job.id, { id: job.id, label, status: 'running',
                       offset: 0, text: '', elapsed: 0 });
    showRun(job.id);
    if (!POLL) POLL = setInterval(poll, 1200);
    poll();
  } catch (e) {
    // The refusal at the concurrency limit arrives here. Say so in the panel
    // rather than silently doing nothing, and leave the other runs alone.
    document.getElementById('runLog').textContent = 'Could not start: ' + e.message;
  }
}

async function poll() {
  const live = [...RUNS.values()].filter(r => r.status === 'running');
  if (!live.length) { clearInterval(POLL); POLL = null; return; }

  let ended = false;
  await Promise.all(live.map(async r => {
    let j;
    try { j = await api(`/api/job/${r.id}?offset=${r.offset}`); }
    catch (e) { return; }          // one blip must not stop the other runs

    if (j.chunk) {
      r.text += j.chunk;
      r.offset = j.offset;
      if (VIEW === r.id) {
        const log = document.getElementById('runLog');
        if (log.textContent === 'Starting\u2026') log.textContent = '';
        log.textContent += j.chunk;
        log.scrollTop = log.scrollHeight;
      }
    }
    r.elapsed = j.elapsed;
    r.status = j.status;
    if (VIEW === r.id) {
      document.getElementById('runTitle').textContent =
        `${j.label} \u00b7 ${say(j.status)} \u00b7 ${j.elapsed}s`;
    }
    if (j.status !== 'running') {
      ended = true;
      if (VIEW === r.id) {
        document.getElementById('runLog').setAttribute('aria-busy', 'false');
        document.getElementById('runStop').hidden = true;
      }
    }
  }));

  drawRunTabs();
  if (ended) loadSkills().then(wireNav);
  if (![...RUNS.values()].some(r => r.status === 'running')) {
    clearInterval(POLL); POLL = null;
  }
}

/* click a skill card to fire it */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-hook="skill-name"]');
  if (!el || !el.dataset.skill) return;
  const s = SKILLS.find(x => x.skill === el.dataset.skill);
  if (s) start(s.skill, s.label, s.prompt);
});

/* Navigation lives in /nav.js now — it promotes these labels to real anchors
   and fills in the ones this comp never drew. BOARD and VAULT are built, and
   RUNS has its own page, so the old "not built yet" wiring is gone. */
function wireNav() {
  // the whole skill card is the target, not just its 16px name
  $$('[data-hook="skill-name"]').forEach(n => {
    const card = n.parentElement;
    if (!card) return;
    card.dataset.hook = 'skill-card';
    card.dataset.skill = n.dataset.skill || '';
    card.onclick = () => {
      const s = SKILLS.find(x => x.skill === card.dataset.skill);
      if (s) start(s.skill, s.label, s.prompt);
    };
  });
  // focus ring anchor for the command bar
  $$('[data-hook="cmd"]').forEach(i => {
    if (i.parentElement) i.parentElement.classList.add('cmdwrap');
    i.setAttribute('aria-label', 'Ask Command Center to run something');
  });

  // cards and nav are divs and spans: give them button semantics so they can be
  // reached and fired from the keyboard, not just clicked
  const activate = el => el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
  });
  $$('[data-hook="skill-card"]').forEach(card => {
    if (card.dataset.kb) return; card.dataset.kb = '1';
    card.tabIndex = 0; card.setAttribute('role', 'button');
    const name = $$('[data-hook="skill-name"]', card)[0];
    card.setAttribute('aria-label', 'Run ' + (name ? name.textContent.trim() : 'skill'));
    activate(card);
  });
}

/* the command bar */
$$('[data-hook="cmd"]').forEach(inp => {
  inp.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter') return;
    const v = inp.value.trim(); if (!v) return;
    inp.value = '';
    start('ad-hoc', 'Ad-hoc request', v);
  });
});

/* ---------- panels fed by /api/state --------------------------------- */
/* The design's panels are styled rows. Rather than rebuild that markup we
   clone the first row of each panel as a template, so any restyle in the
   design document survives a rebuild untouched. */
const HEAD_MARK = 'letter-spacing:.28em';

function panel(title, root) {
  const span = $$('span', root).find(s =>
    s.textContent.trim() === title && s.getAttribute('style')?.includes(HEAD_MARK));
  if (!span) return null;
  const headRow = span.parentElement;
  let container = headRow.parentElement;
  let rows = [...container.children].filter(c => c !== headRow);
  if (!rows.length) {
    // this panel wraps its heading in its own div (NEEDS TYLER)
    const wrapper = container;
    container = wrapper.parentElement;
    const after = [...container.children].slice([...container.children].indexOf(wrapper) + 1);
    rows = [];
    for (const el of after) {
      if ($$('span', el).some(x => x.getAttribute('style')?.includes(HEAD_MARK))) break;
      rows.push(el);
    }
  }
  return { headRow, rows, count: [...headRow.querySelectorAll('span')].pop() };
}

function fill(p, items, paint) {
  if (!p || !p.rows.length) return;
  const tpl = p.rows[0].cloneNode(true);
  const parent = p.rows[0].parentElement;
  // remember what followed the last row so the replacements land in the same
  // slot — some panels share a parent with the panel below them
  const marker = p.rows[p.rows.length - 1].nextSibling;
  p.rows.forEach(r => r.remove());
  const made = [];
  items.forEach((item, i) => {
    const row = tpl.cloneNode(true);
    paint(row, item, i);
    parent.insertBefore(row, marker);
    made.push(row);
  });
  // hand the live rows back: p.rows still pointed at the detached originals,
  // so anything decorating them afterwards (the edit buttons) hit dead nodes
  p.rows = made;
}

const two = n => String(n).padStart(2, '0');

/* Add / close for a state panel.
 *
 * Between morning briefs these lists are the only record of what is actually
 * open, so they have to be editable in place — a brief overwrites them
 * wholesale, but nothing else did until now.
 */
async function stateEdit(body) {
  try {
    await api('/api/state/edit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    await loadState();
  } catch (e) {
    alert('Could not save that change: ' + e.message);
  }
}

function makeEditable(p, list, items, label) {
  if (!p) return;
  p.rows.forEach((row, i) => {
    if (!items[i]) return;
    row.classList.add('cc-row');
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cc-close';
    b.textContent = 'DONE';
    b.title = `Close: ${items[i].title || ''}`;
    b.setAttribute('aria-label', `Close ${label}: ${items[i].title || ''}`);
    b.onclick = ev => {
      ev.stopPropagation();
      stateEdit({ action: 'close', list, index: i });
    };
    row.appendChild(b);
  });
  if (p.headRow && !p.headRow.querySelector('.cc-add')) {
    const a = document.createElement('button');
    a.type = 'button';
    a.className = 'cc-add';
    a.textContent = '+ ADD';
    a.setAttribute('aria-label', `Add ${label}`);
    a.onclick = () => {
      const title = prompt(`New ${label}:`);
      if (!title || !title.trim()) return;
      const meta = prompt('Tag (optional) — e.g. BLOCKING, 2d:', '') || '';
      stateEdit({ action: 'add', list, title: title.trim(), meta: meta.trim() });
    };
    p.headRow.appendChild(a);
  }
}

function renderState(st) {
  ['dark', 'light'].forEach(id => {
    const root = document.getElementById(id);

    if (Array.isArray(st.decisions)) {
      const p = panel('OPEN DECISIONS', root);
      fill(p, st.decisions, (row, d, i) => {
        const spans = $$('span', row), divs = $$('div div', row).length ? $$('div', row) : [];
        if (spans[0]) spans[0].textContent = two(i + 1);
        const inner = $$('div', row);
        if (inner[1]) inner[1].textContent = d.title || '';
        if (inner[2]) inner[2].textContent = (d.meta || '').toUpperCase();
      });
      if (p && p.count) p.count.textContent = two(st.decisions.length);
      if (!st.decisions.length && p && p.rows[0])
        p.rows[0].textContent = 'Nothing waiting on a decision.';
      makeEditable(p, 'decisions', st.decisions, 'decision');
    }

    if (Array.isArray(st.needs)) {
      const p = panel('NEEDS TYLER', root);
      fill(p, st.needs, (row, n) => {
        const spans = $$('span', row);
        if (spans[1]) spans[1].textContent = n.title || '';
        if (spans[2]) spans[2].textContent = n.meta || '';
      });
      if (p && p.count) p.count.textContent = two(st.needs.length);
      makeEditable(p, 'needs', st.needs, 'item');
    }

    if (Array.isArray(st.routines)) {
      const p = panel('ROUTINES', root);
      fill(p, st.routines, (row, r) => {
        const spans = $$('span', row);
        if (spans[0]) spans[0].textContent = r.time;
        if (spans[2]) spans[2].textContent = r.name;
        if (spans[3]) spans[3].textContent = r.status;
      });
      const fired = st.routines.filter(r => r.status === 'DONE').length;
      if (p && p.count) p.count.textContent = `${fired} OF ${st.routines.length} DONE`;
    }

    const mail = st.email;
    if (mail) {
      const total = root.querySelector('[data-hook="mail-total"]');
      if (total && mail.total != null) { total.textContent = mail.total; total.style.color = neutralFor(id); }
      const sync = root.querySelector('[data-hook="mail-synced"]');
      if (sync && st._at) sync.textContent = 'SYNCED ' +
        new Date(st._at * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const buckets = mail.buckets || [];
      const bars = root.querySelector('[data-hook="mail-bars"]');
      const labels = root.querySelector('[data-hook="mail-labels"]');
      if (bars && buckets.length) {
        const bt = bars.children[0];
        const styles = [...bars.children].map(c => c.getAttribute('style'));
        bars.innerHTML = '';
        buckets.forEach((b, i) => {
          const d = bt.cloneNode(true);
          const ramp = id === 'light'
            ? ['rgba(0,0,0,.55)','rgba(0,0,0,.42)','rgba(0,0,0,.30)','rgba(0,0,0,.20)','rgba(0,0,0,.12)']
            : ['rgba(232,246,250,.60)','rgba(232,246,250,.45)','rgba(232,246,250,.33)','rgba(232,246,250,.22)','rgba(232,246,250,.13)'];
          d.setAttribute('style', (styles[i] || styles[styles.length - 1])
            .replace(/flex:\d+/, 'flex:' + Math.max(1, b.count))
            .replace(/background:[^;"]+/, 'background:' + ramp[Math.min(i, 4)]));
          bars.appendChild(d);
        });
      }
      if (labels && buckets.length) {
        const lt = labels.children[0];
        labels.innerHTML = '';
        buckets.forEach(b => {
          const s = lt.cloneNode(true);
          const bold = s.querySelector('b');
          if (bold) { bold.textContent = b.count; s.lastChild.textContent = ' ' + b.label; }
          else s.textContent = `${b.count} ${b.label}`;
          labels.appendChild(s);
        });
      }
    }
  });
}

async function loadState() {
  try { renderState(await api('/api/state')); } catch (e) {}
}

loadSkills().then(wireNav);
loadState();
setInterval(() => loadSkills().then(wireNav), 30000);
setInterval(loadState, 60000);
</script>

<script>
/* A CSS transform scales the painted frame but not the space it reserves, so
   the page keeps 1440px of layout height and leaves dead scroll below. Measure
   both and set the stage height to what is actually drawn. */
(() => {
  const stage = document.getElementById('stage');
  const frame = stage.querySelector('.frame');
  function fitFrame() {
    const room = window.innerWidth - 36;              // #stage padding
    const scale = Math.min(1, room / 1440);
    frame.style.transform = scale < 1 ? `scale(${scale})` : '';
    const on = frame.querySelector('.screen.on');
    const h = (on ? on.offsetHeight : frame.offsetHeight) * scale;
    stage.style.height = h + 36 + 'px';
  }
  window.addEventListener('resize', fitFrame);
  window.addEventListener('load', fitFrame);
  document.addEventListener('DOMContentLoaded', fitFrame);
  // the theme toggle swaps which screen is measured
  document.addEventListener('click', e => {
    if (e.target.closest('#themeBtn')) setTimeout(fitFrame, 0);
  });
  fitFrame();
})();
</script>
