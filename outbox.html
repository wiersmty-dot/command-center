<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA — Outbox</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Palette and fonts come from /theme.css — see runs.html. */
  :root{ --card:var(--panel); --hot:var(--accent); }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  body{padding:0 0 96px}

  header{display:flex;align-items:center;gap:14px;padding:22px 34px;border-bottom:1px solid var(--line)}
  header .mark{font-family:'Michroma',var(--sans);font-size:13px;letter-spacing:.18em}
  header .sub{font:600 10px var(--mono);letter-spacing:.2em;color:var(--dim);
    border-left:1px solid var(--line);padding-left:12px}
  header .count{margin-left:auto;font:500 10px var(--mono);letter-spacing:.14em;color:var(--dim)}

  .lede{padding:30px 34px 6px}
  .lede h1{font:700 38px/1.05 var(--sans);margin:0 0 8px;letter-spacing:-.02em}
  .lede p{margin:0;color:var(--dim);font-size:14px;max-width:64ch;line-height:1.6}
  .lede b{color:var(--ink)}

  .bar{display:flex;align-items:center;gap:10px;padding:20px 34px 14px;flex-wrap:wrap}
  .chip{font:600 9.5px var(--mono);letter-spacing:.14em;padding:7px 13px;border-radius:999px;
    border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer}
  .chip:hover{color:var(--ink);border-color:var(--dim)}
  .chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .wrap{padding:0 34px;display:flex;flex-direction:column;gap:10px}
  .group{font:600 9.5px var(--mono);letter-spacing:.18em;color:var(--dim);
    text-transform:uppercase;margin:16px 0 2px;display:flex;align-items:center;gap:10px}
  .group::after{content:"";flex:1;height:1px;background:var(--line)}

  .item{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;display:flex;flex-direction:column;gap:9px}
  .item .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .item .t{font-weight:600;font-size:14.5px;line-height:1.35}
  .item .path{font:400 10.5px var(--mono);color:var(--dim);overflow-wrap:anywhere}
  .item .status{font:600 8.5px var(--mono);letter-spacing:.12em;padding:3px 8px;
    border-radius:999px;background:var(--line-soft);color:var(--warn);white-space:nowrap}
  .item .when{margin-left:auto;font:400 11px var(--mono);color:var(--dim);white-space:nowrap}

  .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{font:600 9.5px var(--mono);letter-spacing:.12em;padding:7px 13px;border-radius:7px;
    border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
  .btn:hover{border-color:var(--dim)}
  .btn.ok{border-color:var(--accent);color:var(--accent)}
  .btn.ok:hover{background:var(--accent);color:var(--on-accent)}
  .btn.no{border-color:var(--bad);color:var(--bad)}
  .btn.no:hover{background:var(--bad);color:var(--on-accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .note{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--line);
    border-radius:7px;padding:7px 11px;color:var(--ink);font:400 12px var(--mono)}
  .note:focus{outline:none;border-color:var(--accent)}

  .done{border-color:var(--accent);opacity:.6}
  .done .status{color:var(--ok)}
  .msg{font:400 11.5px var(--mono);color:var(--dim)}
  .msg.bad{color:var(--bad)}

  .empty{padding:60px 34px;color:var(--dim);font-size:14px;max-width:60ch;line-height:1.65}
  .empty b{color:var(--ink)}
  .warn{margin:0 34px;padding:11px 15px;border-left:2px solid var(--warn);
    background:var(--panel);border-radius:0 7px 7px 0;font-size:13.5px;color:var(--ink-2)}

  @media (max-width:720px){
    .lede h1{font-size:28px} header,.lede,.bar,.wrap,.empty,.warn{padding-left:18px;padding-right:18px}
    .warn{margin-left:18px;margin-right:18px}
  }
</style>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
</head>
<body>

<header>
  <span class="mark">NOVA</span>
  <span class="sub">OUTBOX</span>
  <span class="count" id="count">LOADING</span>
</header>

<div class="lede">
  <h1>Waiting on you.</h1>
  <p>Every lead and brief an agent writes is stamped <b>Draft — founder approval required</b>,
     because agents draft and only you send. This is that queue in one place. Approving here
     records the decision and stamps the record; <b>it does not contact anyone.</b></p>
</div>

<div class="bar">
  <button class="chip" data-f="all" aria-pressed="true">ALL</button>
  <button class="chip" data-f="OPP-001" aria-pressed="false">OPP-001</button>
  <button class="chip" data-f="OPP-002" aria-pressed="false">OPP-002</button>
  <button class="chip" data-f="OPP-003" aria-pressed="false">OPP-003</button>
</div>

<div id="warn"></div>
<div class="wrap" id="list"></div>
<div class="empty" id="empty" hidden></div>

<script src="/nav.js" defer></script>
<script>
(() => {
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const api = async (p, o) => {
    const r = await fetch(p, o);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Request failed');
    return j;
  };
  const pad = n => String(n).padStart(2, '0');
  const when = ts => {
    const d = new Date(ts * 1000);
    return `${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };

  let items = [], filter = 'all';

  function draw() {
    const list = document.getElementById('list');
    const shown = items.filter(i => filter === 'all' || i.opportunity === filter);
    document.getElementById('count').textContent =
      `${items.length} AWAITING${filter === 'all' ? '' : ` · ${shown.length} SHOWN`}`;

    const empty = document.getElementById('empty');
    if (!shown.length) {
      list.innerHTML = '';
      empty.hidden = false;
      empty.innerHTML = items.length
        ? 'Nothing in this thesis is waiting.'
        : '<b>Nothing is waiting on you.</b><br><br>When an agent writes a lead or a brief it '
          + 'lands here stamped as a draft. An empty queue means every record has been ruled on.';
      return;
    }
    empty.hidden = true;

    let last = null;
    list.innerHTML = shown.map(i => {
      const head = i.opportunity !== last
        ? `<div class="group">${esc(i.opportunity || 'Unlinked')}</div>` : '';
      last = i.opportunity;
      return head + `
        <div class="item" data-name="${esc(i.name)}" data-dir="${esc(i.dir)}">
          <div class="top">
            <span class="t">${esc(i.title)}</span>
            <span class="status">${esc(i.status)}</span>
            <span class="when">${esc(when(i.modified))}</span>
          </div>
          <div class="path">${esc(i.rel)}</div>
          <div class="actions">
            <input class="note" placeholder="reason or scope (optional, goes in the decision log)">
            <button class="btn ok" data-act="approve">APPROVE</button>
            <button class="btn no" data-act="reject">REJECT</button>
            <span class="msg"></span>
          </div>
        </div>`;
    }).join('');

    list.querySelectorAll('[data-act]').forEach(b => b.onclick = () => decide(b));
  }

  async function decide(btn) {
    const card = btn.closest('.item');
    const act = btn.dataset.act;
    const note = card.querySelector('.note').value.trim();
    const msg = card.querySelector('.msg');
    const verb = act === 'approve' ? 'Approve' : 'Reject';

    if (!confirm(`${verb} ${card.querySelector('.t').textContent.trim()}?\n\n`
               + `This stamps the record and writes a decision row. It does not contact anyone.`)) return;

    card.querySelectorAll('button').forEach(x => x.disabled = true);
    msg.className = 'msg';
    msg.textContent = 'Recording…';
    try {
      const r = await api('/api/outbox/decide', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: card.dataset.name, dir: card.dataset.dir, decision: act, note })
      });
      card.classList.add('done');
      card.querySelector('.status').textContent = r.status;
      msg.textContent = r.decision ? `logged as ${r.decision}` : 'recorded';
      if (r.logError) { msg.className = 'msg bad'; msg.textContent = r.logError; }
      items = items.filter(i => i.name !== card.dataset.name);
      document.getElementById('count').textContent = `${items.length} AWAITING`;
    } catch (e) {
      card.querySelectorAll('button').forEach(x => x.disabled = false);
      msg.className = 'msg bad';
      msg.textContent = e.message;
    }
  }

  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    filter = c.dataset.f;
    document.querySelectorAll('.chip').forEach(o => o.setAttribute('aria-pressed', String(o === c)));
    draw();
  });

  (async () => {
    try {
      const j = await api('/api/outbox');
      items = j.items || [];
      if (j.error) {
        document.getElementById('warn').innerHTML =
          `<div class="warn"><b>Part of the workspace could not be read.</b> ${esc(j.error)}
           <br>The queue below may be incomplete.</div>`;
      }
      draw();
    } catch (e) {
      document.getElementById('count').textContent = 'SERVER OFFLINE';
      document.getElementById('empty').hidden = false;
      document.getElementById('empty').textContent =
        'The server is not responding. Restart it with: python3 server.py';
    }
  })();
})();
</script>
</body>
</html>
