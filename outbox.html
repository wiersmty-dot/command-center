<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA — Outbox</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Outbox rides the Mission Control system in /hud.css: `.tile` is the queued
   record, `.chip` is its status, `.hud-pill` is the nav. Only what the HUD has
   no word for is defined here -- the thesis filter, the note field, and the
   approve/reject pair. */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}
.filt{font:600 11px 'JetBrains Mono',monospace;letter-spacing:.1em;padding:6px 13px;
  border-radius:4px;cursor:pointer;background:transparent;
  border:1px solid color-mix(in oklch, var(--cy) 22%, transparent);color:var(--dim)}
.filt:hover{color:var(--ink);border-color:color-mix(in oklch, var(--cy) 45%, transparent)}
.filt[aria-pressed="true"]{background:color-mix(in oklch, var(--cy) 14%, transparent);
  border-color:color-mix(in oklch, var(--cy) 55%, transparent);color:var(--cy-br)}
.filt:focus-visible{outline:2px solid var(--ring);outline-offset:2px}

.group{display:flex;align-items:center;gap:10px;margin:20px 0 9px;
  font:600 11px 'JetBrains Mono',monospace;letter-spacing:.16em;
  color:var(--dim);text-transform:uppercase}
.group::after{content:"";flex:1;height:1px;background:color-mix(in oklch, var(--cy) 14%, transparent)}
.group b{color:var(--cy-br)}

.tile+.tile{margin-top:8px}
.path{font:400 11px 'JetBrains Mono',monospace;color:var(--dim);
  overflow-wrap:anywhere;margin-top:5px}
.when{margin-left:auto;font:400 11px 'JetBrains Mono',monospace;
  color:var(--dim);white-space:nowrap}

.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:11px}
.note{flex:1;min-width:180px;border-radius:4px;padding:7px 11px;
  background:var(--ground);border:1px solid color-mix(in oklch, var(--cy) 22%, transparent);
  color:var(--ink);font:400 12px 'JetBrains Mono',monospace}
.note::placeholder{color:var(--dim)}
.note:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.btn{font:600 11px 'JetBrains Mono',monospace;letter-spacing:.1em;padding:7px 13px;
  border-radius:4px;cursor:pointer;background:transparent;
  border:1px solid color-mix(in oklch, var(--cy) 30%, transparent);color:var(--ink)}
.btn.ok{border-color:color-mix(in oklch, var(--emerald) 55%, transparent);color:var(--emerald)}
.btn.ok:hover:not(:disabled){background:color-mix(in oklch, var(--emerald) 16%, transparent)}
.btn.no{border-color:color-mix(in oklch, var(--coral) 55%, transparent);color:var(--coral)}
.btn.no:hover:not(:disabled){background:color-mix(in oklch, var(--coral) 16%, transparent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.msg{font:400 11px 'JetBrains Mono',monospace;color:var(--dim)}
.msg.bad{color:var(--coral)}
.done{opacity:.55}

.lede{margin:0 0 16px;color:var(--ink-2);font-size:15px;
  line-height:1.6;max-width:70ch}
.lede b{color:var(--ink)}
.warn{margin:0 0 14px;padding:11px 14px;border-radius:6px;
  border-left:2px solid var(--amber);background:var(--glass);
  color:var(--ink-2);font-size:14px}
</style>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
</head>
<body>

<div class="tile tile--lifted">
  <div class="tile-head">
    <div class="tile-name"><span class="dot" data-s="warn" aria-label="Status: warn"></span>
      <h2 class="tile-title">Waiting on you</h2></div>
    <span class="tile-meta" id="count">LOADING</span>
  </div>
  <div class="tile-body">
    <p class="lede">Every lead and brief an agent writes is stamped
      <b>Draft &mdash; founder approval required</b>, because agents draft and only you
      send. This is that queue in one place. Approving here records the decision and
      stamps the record; <b>it does not contact anyone.</b></p>
    <div class="filters">
      <button class="filt" data-f="all" aria-pressed="true">ALL</button>
      <button class="filt" data-f="OPP-001" aria-pressed="false">OPP-001</button>
      <button class="filt" data-f="OPP-002" aria-pressed="false">OPP-002</button>
      <button class="filt" data-f="OPP-003" aria-pressed="false">OPP-003</button>
    </div>
  </div>
</div>

<div id="warn"></div>
<div id="list"></div>
<div class="empty" id="empty" hidden></div>

<script src="/hud-shell.js" data-hud-title="OUTBOX"
        data-hud-sub="Drafts awaiting a founder decision"></script>
<script>
(() => {
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const api = async (p, o) => {
    const r = await fetch(p, o);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Request failed');
    return j;
  };
  const pad = n => String(n).padStart(2, '0');
  const when = ts => {
    const d = new Date(ts * 1000);
    return `${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };

  let items = [], filter = 'all';

  function draw() {
    const list = document.getElementById('list');
    const shown = items.filter(i => filter === 'all' || i.opportunity === filter);
    document.getElementById('count').textContent =
      `${items.length} AWAITING${filter === 'all' ? '' : ` · ${shown.length} SHOWN`}`;

    const empty = document.getElementById('empty');
    if (!shown.length) {
      list.innerHTML = '';
      empty.hidden = false;
      empty.innerHTML = items.length
        ? 'Nothing in this thesis is waiting.'
        : '<b>Nothing is waiting on you.</b><br><br>When an agent writes a lead or a brief it '
          + 'lands here stamped as a draft. An empty queue means every record has been ruled on.';
      return;
    }
    empty.hidden = true;

    let last = null;
    list.innerHTML = shown.map(i => {
      const head = i.opportunity !== last
        ? `<div class="group">${esc(i.opportunity || 'Unlinked')}</div>` : '';
      last = i.opportunity;
      return head + `
        <div class="tile item" data-name="${esc(i.name)}" data-dir="${esc(i.dir)}">
          <div class="tile-head">
            <div class="tile-name"><span class="dot" data-s="warn"></span>
              <h3 class="tile-title t">${esc(i.title)}</h3></div>
            <span class="chip" data-t="warn">${esc(i.status)}</span>
            <span class="when">${esc(when(i.modified))}</span>
          </div>
          <div class="path">${esc(i.rel)}</div>
          <div class="actions">
            <input class="note" placeholder="reason or scope (optional, goes in the decision log)">
            <button class="btn ok" data-act="approve">APPROVE</button>
            <button class="btn no" data-act="reject">REJECT</button>
            <span class="msg"></span>
          </div>
        </div>`;
    }).join('');

    list.querySelectorAll('[data-act]').forEach(b => b.onclick = () => decide(b));
  }

  async function decide(btn) {
    const card = btn.closest('.item');
    const act = btn.dataset.act;
    const note = card.querySelector('.note').value.trim();
    const msg = card.querySelector('.msg');
    const verb = act === 'approve' ? 'Approve' : 'Reject';

    if (!confirm(`${verb} ${card.querySelector('.t').textContent.trim()}?\n\n`
               + `This stamps the record and writes a decision row. It does not contact anyone.`)) return;

    card.querySelectorAll('button').forEach(x => x.disabled = true);
    msg.className = 'msg';
    msg.textContent = 'Recording…';
    try {
      const r = await api('/api/outbox/decide', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: card.dataset.name, dir: card.dataset.dir, decision: act, note })
      });
      card.classList.add('done');
      card.querySelector('.chip').textContent = r.status;
      msg.textContent = r.decision ? `logged as ${r.decision}` : 'recorded';
      if (r.logError) { msg.className = 'msg bad'; msg.textContent = r.logError; }
      items = items.filter(i => i.name !== card.dataset.name);
      document.getElementById('count').textContent = `${items.length} AWAITING`;
    } catch (e) {
      card.querySelectorAll('button').forEach(x => x.disabled = false);
      msg.className = 'msg bad';
      msg.textContent = e.message;
    }
  }

  document.querySelectorAll('.filt').forEach(c => c.onclick = () => {
    filter = c.dataset.f;
    document.querySelectorAll('.filt').forEach(o => o.setAttribute('aria-pressed', String(o === c)));
    draw();
  });

  (async () => {
    try {
      const j = await api('/api/outbox');
      items = j.items || [];
      if (j.error) {
        document.getElementById('warn').innerHTML =
          `<div class="warn"><b>Part of the workspace could not be read.</b> ${esc(j.error)}
           <br>The queue below may be incomplete.</div>`;
      }
      draw();
    } catch (e) {
      document.getElementById('count').textContent = 'SERVER OFFLINE';
      document.getElementById('empty').hidden = false;
      document.getElementById('empty').textContent =
        'The server is not responding. Restart it with: python3 server.py';
    }
  })();
})();
</script>
</body>
</html>
